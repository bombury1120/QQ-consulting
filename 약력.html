  <script>
    (function(){
      var STORAGE_KEY = 'qq_theme_isNight';
      function applyTheme(isNight){ if (isNight) document.documentElement.classList.add('theme-night'); else document.documentElement.classList.remove('theme-night'); document.querySelectorAll('.theme-toggle').forEach(function(btn){ btn.textContent = isNight ? 'day' : 'night'; btn.setAttribute('aria-pressed', isNight ? 'true' : 'false'); }); }
      function saveTheme(isNight){ try { localStorage.setItem(STORAGE_KEY, isNight ? '1' : '0'); } catch(e){ } }
      function loadTheme(){ try { return localStorage.getItem(STORAGE_KEY) === '1'; } catch(e){ return false; } }
      function toggleTheme(){ var isNight = document.documentElement.classList.toggle('theme-night'); applyTheme(isNight); saveTheme(isNight); }
      document.querySelectorAll('.theme-toggle').forEach(function(btn){ btn.addEventListener('click', toggleTheme); });
      applyTheme(loadTheme());
    })();
  </script>
